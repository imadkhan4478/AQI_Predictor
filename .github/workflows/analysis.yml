name: Analysis

# Runs the model comparison and the EDA notebook on a runner and commits the
# results back. Both read the whole feature group, which is the step that fails
# from the development machine on a sustained transfer.
on:
  workflow_dispatch:
    inputs:
      what:
        description: Which analysis to run
        type: choice
        default: both
        options: [both, comparison, eda]

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # TensorFlow cannot be resolved alongside hopsworks in one pass, so it is
      # installed second. The comparison needs it for the neural-net row.
      - if: inputs.what != 'eda'
        run: pip install -r requirements-deep.txt

      - name: Compare every candidate against the baseline
        if: inputs.what != 'eda'
        run: python -m training_pipeline.train
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

      # nbconvert's per-cell timeout defaults to 30s, which the feature-store
      # read alone exceeds.
      - name: Execute the EDA notebook
        if: inputs.what != 'comparison'
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            notebooks/01_eda.ipynb
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/model_comparison.json notebooks/01_eda.ipynb
          if git diff --quiet --cached; then
            echo "No change in the analysis outputs."
          else
            git commit -m "Refresh analysis outputs (${{ inputs.what }})"
            git push
          fi
