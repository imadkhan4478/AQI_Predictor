name: Feature Pipeline

on:
  schedule:
    - cron: "23 * * * *" # hourly, off the top of the hour
  workflow_dispatch:

jobs:
  fetch-features:
    runs-on: ubuntu-latest
    # An hourly job must never outlive its schedule; hopsworks.login() has
    # hung for far longer than this on a bad connection.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m feature_pipeline.pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          CITY_NAME: ${{ secrets.CITY_NAME }}
          CITY_LAT: ${{ secrets.CITY_LAT }}
          CITY_LON: ${{ secrets.CITY_LON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
