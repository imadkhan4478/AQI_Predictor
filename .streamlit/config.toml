# The theme is pinned rather than left to the viewer's preference, so the page a
# reviewer opens is the page it was designed against and the CSS below has a known
# background to sit on. Ink and grey to match the technical report's typography.
[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f8"
textColor = "#1a1a1a"
font = "sans serif"

[client]
toolbarMode = "minimal"
